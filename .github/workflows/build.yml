name: Build Yutobok APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f YutobokAndroid/settings.gradle
          test -f YutobokAndroid/build.gradle
          test -f YutobokAndroid/app/build.gradle
          test -f YutobokAndroid/app/src/main/AndroidManifest.xml
          test -f YutobokAndroid/app/src/main/assets/index.html
          echo "Android project files found."

      - name: Build debug APK
        working-directory: YutobokAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: test -s YutobokAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yutobok-Android-APK
          path: YutobokAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
